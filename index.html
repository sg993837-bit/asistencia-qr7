function makeQR(text){
const EC=[0,10,16,26,18,24,16],NB=[0,1,1,1,2,2,4];
const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55}return r};
const data=[...new TextEncoder().encode(text)];let ver=0;
for(let v=1;v<=6;v++){if(data.length*8+12<=(Math.floor(raw(v)/8)-EC[v]*NB[v])*8){ver=v;break}}
if(!ver)throw new Error("Enlace demasiado largo");
const dc=Math.floor(raw(ver)/8)-EC[ver]*NB[ver],bits=[];
const put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1)};
put(4,4);put(data.length,8);data.forEach(b=>put(b,8));
for(let i=0;i<4&&bits.length<dc*8;i++)bits.push(0);
while(bits.length%8)bits.push(0);
const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8).join(""),2));
for(let p=0xEC;cw.length<dc;p^=0xEC^0x11)cw.push(p);
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
const div=d=>{const r=new Array(d).fill(0);r[d-1]=1;let t=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],t);if(j+1<d)r[j]^=r[j+1]}t=mul(t,2)}return r};
const rem=(d,g)=>{const r=g.map(()=>0);for(const b of d){const f=b^r.shift();r.push(0);g.forEach((c,i)=>r[i]^=mul(c,f))}return r};
const nb=NB[ver],el=EC[ver],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),g=div(el),blocks=[];
for(let i=0,k=0;i<nb;i++){const d=cw.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const e=rem(d,g);if(i<ns)d.push(0);blocks.push(d.concat(e))}
const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-el||j>=ns)all.push(b[i])});
const N=ver*4+17,M=[],F=[];for(let i=0;i<N;i++){M.push(new Array(N).fill(false));F.push(new Array(N).fill(false))}
const sf=(x,y,v)=>{M[y][x]=v;F[y][x]=true};
for(let i=0;i<N;i++){sf(6,i,i%2==0);sf(i,6,i%2==0)}
const fnd=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<N&&yy>=0&&yy<N)sf(xx,yy,d!=2&&d!=4)}};
fnd(3,3);fnd(N-4,3);fnd(3,N-4);
if(ver>=2){const ap=[6,N-7];for(const a of ap)for(const b of ap){if((a==6&&b==6)||(a==6&&b==N-7)||(a==N-7&&b==6))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}}
const fmt=m=>{const d=(0<<3)|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,bt=i=>((b>>>i)&1)!=0;
for(let i=0;i<=5;i++)sf(8,i,bt(i));sf(8,7,bt(6));sf(8,8,bt(7));sf(7,8,bt(8));for(let i=9;i<15;i++)sf(14-i,8,bt(i));
for(let i=0;i<8;i++)sf(N-1-i,8,bt(i));for(let i=8;i<15;i++)sf(8,N-15+i,bt(i));sf(8,N-8,true)};
fmt(0);
let i=0;for(let r=N-1;r>=1;r-=2){if(r==6)r=5;for(let v=0;v<N;v++)for(let j=0;j<2;j++){const x=r-j,y=((r+1)&2)==0?N-1-v:v;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!=0;i++}}}
const mk=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
let best=null,bp=1e9;
for(let m=0;m<8;m++){const S=M.map(r=>r.slice()),T=F;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!T[y][x]&&mk[m](x,y))S[y][x]=!S[y][x];
 const sv=M.map(r=>r.slice());for(let y=0;y<N;y++)for(let x=0;x<N;x++)M[y][x]=S[y][x];fmt(m);
 let p=0;for(let a=0;a<N;a++){let rx=1,ry=1;for(let b=1;b<N;b++){rx=M[a][b]==M[a][b-1]?rx+1:1;ry=M[b][a]==M[b-1][a]?ry+1:1;if(rx==5)p+=3;else if(rx>5)p++;if(ry==5)p+=3;else if(ry>5)p++}}
 for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++)if(M[y][x]==M[y][x+1]&&M[y][x]==M[y+1][x]&&M[y][x]==M[y+1][x+1])p+=3;
 if(p<bp){bp=p;best=M.map(r=>r.slice())}
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)M[y][x]=sv[y][x]}
return best}

 const r=await fetch(SUPABASE_URL+path,{method:opt.method||"GET",headers:Object.assign(h,opt.headers||{}),body:opt.body});
 const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
 if(!r.ok)return{data:null,error:{code:(j&&j.code)||String(r.status),message:(j&&(j.message||j.msg||j.error_description))||tx}};
